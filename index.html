<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship</title>
<style>
  :root { --bg: #070d16; --text: #dbe9f2; --dim: #8fa6b5; --accent: #46d4ea; --line: #1d3442; --card: #0d1a26; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 0%, #10263a 0%, var(--bg) 60%); color: var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height: 1.6; }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 72px 16px 32px; box-sizing: border-box; text-align: center; }
  h1 { color: var(--accent); font-size: 2.6rem; letter-spacing: 0.25em; margin: 0 0 8px; padding-left: 0.25em; text-shadow: 0 0 24px rgba(70, 212, 234, 0.45); }
  .tag { color: var(--dim); margin: 0 0 48px; }
  .links { display: flex; flex-direction: column; gap: 14px; }
  .links a { display: block; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-decoration: none; font-size: 1.05rem; transition: border-color 0.15s, transform 0.15s; }
  .links a:hover { border-color: var(--accent); transform: translateY(-1px); }
  .links span { color: var(--accent); float: right; }
  .contact { margin-top: 32px; color: var(--dim); font-size: 0.95rem; }
  .contact a { color: var(--accent); }
  footer { color: var(--dim); font-size: 0.8rem; text-align: center; padding: 24px 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>STARSHIP</h1>
  <p class="tag">외계 괴물을 사냥하는 모바일 협동 슈팅 게임</p>
  <div class="links">
    <a href="/privacy">개인정보 처리방침 <span>›</span></a>
    <a href="/terms">이용약관 <span>›</span></a>
  </div>
  <p class="contact">문의: <a href="mailto:wisp.korea@gmail.com">wisp.korea@gmail.com</a></p>
</main>
<footer>상호: 위습 · 대표자: 강현우 · 사업자등록번호: 454-45-01298</footer>
</body>
</html>
